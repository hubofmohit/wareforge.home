<svg viewBox="0 0 600 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Warehouse floor plan preview" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

    <!-- Grid -->
    <defs>
        <pattern id="warehouseGrid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,217,255,0.12)" stroke-width="1" />
        </pattern>

        <linearGradient id="zoneGlow" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.18" />
            <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.04" />
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="glowStrong">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Background grid -->
    <rect x="30" y="30" width="540" height="440" fill="url(#warehouseGrid)" opacity="0.8" />

    <g id="wfScene">

        <!-- Warehouse outer boundary -->
        <rect x="80" y="90" width="440" height="300" rx="4" fill="rgba(0,217,255,0.025)" stroke="#00d9ff" stroke-width="2" filter="url(#glow)" />

        <!-- Zone A -->
        <g class="wf-zone">
            <title>Zone A — Draw and resize zones directly on the grid.</title>
            <rect class="wf-zone-rect" x="105" y="115" width="180" height="110" fill="url(#zoneGlow)" stroke="#00d9ff" stroke-width="1.5" />
            <text class="wf-zone-label" x="125" y="145" fill="#00d9ff" font-size="15" font-family="monospace">ZONE A</text>

            <g stroke="#00d9ff" stroke-width="1" opacity="0.7">
                <line x1="125" y1="170" x2="265" y2="170" />
                <line x1="125" y1="190" x2="265" y2="190" />
                <line x1="125" y1="210" x2="265" y2="210" />
                <line x1="145" y1="160" x2="145" y2="215" />
                <line x1="185" y1="160" x2="185" y2="215" />
                <line x1="225" y1="160" x2="225" y2="215" />
            </g>
        </g>

        <!-- Zone B -->
        <g class="wf-zone">
            <title>Zone B — Custom-named zone storage.</title>
            <rect class="wf-zone-rect" x="305" y="115" width="190" height="110" fill="rgba(0,217,255,0.04)" stroke="#00ff9d" stroke-width="1.5" />
            <text class="wf-zone-label" x="325" y="145" fill="#00ff9d" font-size="15" font-family="monospace">ZONE B</text>

            <g fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.7">
                <rect x="330" y="165" width="45" height="35" />
                <rect x="385" y="165" width="45" height="35" />
                <rect x="440" y="165" width="35" height="35" />
                <rect x="330" y="205" width="45" height="10" />
                <rect x="385" y="205" width="45" height="10" />
                <rect x="440" y="205" width="35" height="10" />
            </g>
        </g>

        <!-- Zone C -->
        <g class="wf-zone">
            <title>Zone C — Storage racks.</title>
            <rect class="wf-zone-rect" x="105" y="250" width="390" height="110" fill="rgba(0,217,255,0.025)" stroke="#00d9ff" stroke-width="1.5" />
            <text class="wf-zone-label" x="125" y="280" fill="#00d9ff" font-size="15" font-family="monospace">ZONE C</text>

            <g fill="rgba(0,217,255,0.08)" stroke="#00d9ff" stroke-width="1">
                <rect x="130" y="300" width="70" height="35" />
                <rect x="215" y="300" width="70" height="35" />
                <rect x="300" y="300" width="70" height="35" />
                <rect x="385" y="300" width="70" height="35" />
            </g>
        </g>

        <!-- Loading / receiving -->
        <line x1="80" y1="375" x2="520" y2="375" stroke="#00d9ff" stroke-width="2" />
        <text x="250" y="410" fill="#00d9ff" font-size="13" font-family="monospace" opacity="0.8">
            LOADING / RECEIVING
        </text>

        <!-- Dimension line -->
        <line x1="80" y1="440" x2="520" y2="440" stroke="#00d9ff" stroke-width="1" />
        <line x1="80" y1="432" x2="80" y2="448" stroke="#00d9ff" />
        <line x1="520" y1="432" x2="520" y2="448" stroke="#00d9ff" />
        <text x="270" y="435" fill="#00d9ff" font-size="12" font-family="monospace">LENGTH</text>

        <!-- Scanner -->
        <rect x="90" y="95" width="420" height="3" fill="#00ff9d" opacity="0.8" filter="url(#glow)">
            <animate attributeName="y" values="95;385;95" dur="5s" repeatCount="indefinite" />
        </rect>

        <!-- Location points -->
        <g fill="#00ff9d" filter="url(#glow)">
            <circle cx="145" cy="175" r="4">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="350" cy="185" r="4">
                <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="250" cy="320" r="4">
                <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite" />
            </circle>
            <circle cx="420" cy="320" r="4">
                <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite" />
            </circle>
        </g>

        <!-- Status panel -->
        <rect x="390" y="55" width="150" height="45" rx="4" fill="rgba(0,10,18,0.85)" stroke="#00d9ff" />
        <text x="405" y="75" fill="#00d9ff" font-size="10" font-family="monospace">LAYOUT STATUS</text>
        <text id="wfStatusText" x="405" y="91" fill="#00ff9d" font-size="11" font-family="monospace">● DYNAMIC</text>

    </g>
</svg>
